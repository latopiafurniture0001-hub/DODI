name: DODI Native Windows Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dodi-windows-native.yml"
      - "DODI-CAM-FINAL-NATIVE-OPERATOR-SIMPLE-PLASMA-READY-SOURCE.zip"

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify native DODI source
        shell: powershell
        run: |
          $src = "DODI-CAM-FINAL-NATIVE-OPERATOR-SIMPLE-PLASMA-READY-SOURCE.zip"
          if (!(Test-Path $src)) { throw "Native DODI source ZIP is missing: $src" }
          Write-Host "Native source found: $src"
      - name: Install build tools
        shell: powershell
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y --no-progress
          choco install innosetup -y --no-progress
          choco install 7zip -y --no-progress
      - name: Download FreeCAD Windows LibPack
        shell: powershell
        run: |
          $url = "https://github.com/FreeCAD/FreeCAD-LibPack/releases/download/3.5.5/LibPack-26.3.0-v3.5.5-x64-Release.7z"
          $archive = Join-Path $PWD "LibPack-x64-Release.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive -Headers @{ "User-Agent" = "DODI-CAM-Windows-Build" }
          if (!(Test-Path $archive)) { throw "LibPack download failed." }

          New-Item -ItemType Directory -Force -Path libpack | Out-Null
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (!$sevenZip) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }
          if (!(Test-Path $sevenZip)) { throw "7-Zip executable not found." }

          & $sevenZip x $archive "-olibpack" -y
          if ($LASTEXITCODE -ne 0) { throw "7-Zip failed to extract LibPack." }

          function Find-AncestorWithLibPackLayout([string]$startPath) {
            $current = Get-Item $startPath
            while ($current) {
              $hasBin = Test-Path (Join-Path $current.FullName "bin")
              $hasInclude = Test-Path (Join-Path $current.FullName "include")
              $hasLib = Test-Path (Join-Path $current.FullName "lib")
              if ($hasBin -and $hasInclude -and $hasLib) { return $current.FullName }
              $parent = $current.Parent
              if (!$parent -or $parent.FullName -eq $current.FullName) { break }
              $current = $parent
            }
            return $null
          }

          $qsvg = Get-ChildItem -Path libpack -Recurse -Filter "qsvg.dll" -File | Select-Object -First 1
          if (!$qsvg) { throw "qsvg.dll was not found in extracted LibPack." }

          $libPackRoot = Find-AncestorWithLibPackLayout $qsvg.Directory.FullName
          if (!$libPackRoot) {
            Write-Host "Could not derive LibPack root from qsvg.dll. Nearby structure:"
            Get-ChildItem -Path $qsvg.Directory.FullName -Directory -Force | ForEach-Object { Write-Host $_.FullName }
            throw "Valid FreeCAD LibPack root (bin/include/lib) was not found."
          }

          $qt6Config = Get-ChildItem -Path $libPackRoot -Recurse -Filter "Qt6Config.cmake" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $yamlConfig = Get-ChildItem -Path $libPackRoot -Recurse -Filter "yaml-cpp-config.cmake" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$qt6Config) { throw "Qt6Config.cmake was not found in FreeCAD LibPack." }
          if (!$yamlConfig) { throw "yaml-cpp-config.cmake was not found in FreeCAD LibPack." }

          $qt6Dir = $qt6Config.Directory.FullName
          $yamlCppDir = $yamlConfig.Directory.FullName
          $cmakeLibDir = Join-Path $libPackRoot "lib\cmake"

          Write-Host "FreeCAD LibPack root: $libPackRoot"
          Write-Host "Qt6 package: $qt6Dir"
          Write-Host "yaml-cpp package: $yamlCppDir"
          Write-Host "LibPack CMake packages: $cmakeLibDir"

          "FREECAD_LIBPACK_DIR=$libPackRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "QT6_DIR=$qt6Dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "YAML_CPP_DIR=$yamlCppDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_PREFIX_PATH=$cmakeLibDir;$qt6Dir;$yamlCppDir;$libPackRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Extract native source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path source | Out-Null
          Expand-Archive -Path "DODI-CAM-FINAL-NATIVE-OPERATOR-SIMPLE-PLASMA-READY-SOURCE.zip" -DestinationPath source -Force
          $dirs = Get-ChildItem source -Directory
          if ($dirs.Count -eq 1) { $root = $dirs[0].FullName } else { $root = (Resolve-Path source).Path }
          "DODI_SOURCE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Restore FreeCAD Coin/Pivy submodules
        shell: powershell
        run: |
          $coin = Join-Path "$env:DODI_SOURCE_ROOT" "src\\3rdParty\\coin"
          $ondsel = Join-Path "$env:DODI_SOURCE_ROOT" "src\\3rdParty\\OndselSolver"
          $pivy = Join-Path "$env:DODI_SOURCE_ROOT" "src\\3rdParty\\pivy"

          Write-Host "FreeCAD LibPack 3.5.5 does not bundle Coin/Pivy; restoring the FreeCAD-vendored submodules required by SetupBundledCoinPivy."

          if (!(Test-Path (Join-Path $coin "CMakeLists.txt"))) {
            if (Test-Path $coin) { Remove-Item $coin -Recurse -Force }
            New-Item -ItemType Directory -Force -Path (Split-Path $coin) | Out-Null
            git clone --depth 1 --branch freecad-master --recurse-submodules https://github.com/FreeCAD/coin.git $coin
            if ($LASTEXITCODE -ne 0) { throw "Failed to restore bundled Coin submodule." }
          }

          if (!(Test-Path (Join-Path $pivy "CMakeLists.txt"))) {
            if (Test-Path $pivy) { Remove-Item $pivy -Recurse -Force }
            New-Item -ItemType Directory -Force -Path (Split-Path $pivy) | Out-Null
            git clone --depth 1 --branch freecad-master --recurse-submodules https://github.com/FreeCAD/pivy.git $pivy
            if ($LASTEXITCODE -ne 0) { throw "Failed to restore bundled Pivy submodule." }
          }

          if (!(Test-Path (Join-Path $coin "CMakeLists.txt"))) { throw "Bundled Coin CMakeLists.txt is still missing." }
          if (!(Test-Path (Join-Path $pivy "CMakeLists.txt"))) { throw "Bundled Pivy CMakeLists.txt is still missing." }

          if (!(Test-Path (Join-Path $ondsel "CMakeLists.txt"))) {
            if (Test-Path $ondsel) { Remove-Item $ondsel -Recurse -Force }
            New-Item -ItemType Directory -Force -Path (Split-Path $ondsel) | Out-Null
            git clone --depth 1 --recurse-submodules https://github.com/FreeCAD/OndselSolver.git $ondsel
            if ($LASTEXITCODE -ne 0) { throw "Failed to restore bundled OndselSolver submodule." }
          }

          if (!(Test-Path (Join-Path $coin "CMakeLists.txt"))) { throw "Bundled Coin CMakeLists.txt is still missing." }
          if (!(Test-Path (Join-Path $pivy "CMakeLists.txt"))) { throw "Bundled Pivy CMakeLists.txt is still missing." }
          if (!(Test-Path (Join-Path $ondsel "CMakeLists.txt"))) { throw "Bundled OndselSolver CMakeLists.txt is still missing." }

          Write-Host "Bundled Coin restored: $coin"
          Write-Host "Bundled Pivy restored: $pivy"
          Write-Host "Bundled OndselSolver restored: $ondsel"
      - name: Configure native Windows build
        shell: powershell
        run: |
          Write-Host "Using LibPack: $env:FREECAD_LIBPACK_DIR"
          cmake -S "$env:DODI_SOURCE_ROOT" -B build -G "Visual Studio 17 2022" -A x64 `
            -DFREECAD_LIBPACK_DIR="$env:FREECAD_LIBPACK_DIR" `
            -DQt6_DIR="$env:QT6_DIR" `
            -Dyaml-cpp_DIR="$env:YAML_CPP_DIR" `
            -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH" `
            -DFREECAD_COPY_LIBPACK_BIN_TO_BUILD=ON `
            -DFREECAD_COPY_DEPEND_DIRS_TO_BUILD=ON `
            -DFREECAD_COPY_PLUGINS_BIN_TO_BUILD=ON `
            -DFREECAD_USE_PCH=OFF
      - name: Build Release
        shell: powershell
        run: cmake --build build --config Release --parallel 2
      - name: Verify native executable
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "FreeCAD.exe" | Select-Object -First 1
          if (!$exe) { throw "Native executable was not produced." }
          Write-Host "Native executable: $($exe.FullName)"
      - name: Verify no browser wrapper
        shell: powershell
        run: |
          $files = Get-ChildItem -Path build -Recurse -File -ErrorAction SilentlyContinue
          $bad = $files | Where-Object { $_.Name -match "chrome\.exe|msedge\.exe|electron\.exe" }
          if ($bad) { throw "Browser wrapper executable detected." }
      - name: Package native build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Path build -Destination package\build -Recurse -Force
          Compress-Archive -Path package\* -DestinationPath DODI-CAM-Native-Windows-Build.zip -Force
      - name: Build installer
        shell: powershell
        run: |
          $iss = @'
          [Setup]
          AppName=DODI CAM
          AppVersion=1.0.0
          DefaultDirName={autopf}\DODI CAM
          OutputBaseFilename=DODI-CAM-Setup
          ArchitecturesInstallIn64BitMode=x64
          Compression=lzma
          SolidCompression=yes
          [Files]
          Source: "package\build\**\*"; DestDir: "{app}\build"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{autodesktop}\DODI CAM"; Filename: "{app}\build\bin\FreeCAD.exe"
          Name: "{group}\DODI CAM"; Filename: "{app}\build\bin\FreeCAD.exe"
          [UninstallDelete]
          Type: filesandordirs; Name: "{app}"
          '@
          $iss | Set-Content -Encoding UTF8 DODI-CAM.iss
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" DODI-CAM.iss
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DODI-CAM-Windows-Installer
          path: |
            DODI-CAM-Setup.exe
            DODI-CAM-Native-Windows-Build.zip
          if-no-files-found: error
